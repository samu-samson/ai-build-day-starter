<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Officer console — starter</title>
<style>
  :root{--ink:#1f1f1f;--mut:#6c6c6c;--line:#ddd;--acc:#3c3489;--ok:#0f6e56;--okbg:#e1f5ee;--bad:#a32d2d;--badbg:#fcebeb;--warnbg:#faeeda;--warn:#854f0b}
  *{box-sizing:border-box} body{font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;margin:0;color:var(--ink);background:#fafaf8}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:650} .syn{font-size:11px;background:var(--warnbg);color:var(--warn);padding:2px 8px;border-radius:999px;font-weight:700}
  header input,header select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px}
  main{max-width:900px;margin:0 auto;padding:18px 20px 60px}
  .bar{display:flex;gap:8px;margin:0 0 16px} .bar input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font:inherit}
  button{padding:9px 14px;border:1px solid var(--acc);border-radius:7px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.sec{background:#fff;color:var(--acc)}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
  .card h3{margin:0 0 6px;font-size:14px} .ok{border-left:4px solid var(--ok)} .bad{border-left:4px solid var(--bad);background:var(--badbg)}
  .kv{display:grid;grid-template-columns:160px 1fr;gap:4px 12px;font-size:13.5px} .kv b{font-weight:600;color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px} td,th{border-top:1px solid var(--line);padding:6px 8px;text-align:left} th{color:var(--mut);font-size:11px;text-transform:uppercase}
  .status-ok{color:var(--ok);font-weight:700} .status-bad{color:var(--bad);font-weight:700}
  dialog{border:1px solid var(--line);border-radius:10px;padding:18px;max-width:420px} dialog::backdrop{background:rgba(0,0,0,.35)}
</style>
</head>
<body>
<header>
  <h1>Officer console</h1><span class="syn">SYNTHETIC DATA</span>
  <label>API <input id="base" value="http://localhost:8000" size="22"></label>
  <label>Acting as
    <select id="who">
      <option value="internal">INTERNAL-APP (your office)</option>
      <option value="partner">PARTNER-AGENCY (simulated partner)</option>
    </select>
  </label>
</header>
<main>
  <div class="bar">
    <input id="rid" placeholder="Record ID, e.g. SBX-REG-0004" value="SBX-REG-0004">
    <button onclick="verify()">Verify</button>
    <button class="sec" onclick="detail()">Full record</button>
    <button class="sec" onclick="fileReq()">File renewal…</button>
    <button class="sec" onclick="log()">Access log</button>
  </div>
  <div id="out"></div>
</main>
<dialog id="confirm">
  <h3 style="margin-top:0">Confirm before filing</h3>
  <div id="csum" class="kv" style="margin-bottom:14px"></div>
  <button onclick="confirmYes()">Confirm and file</button>
  <button class="sec" onclick="document.getElementById('confirm').close()">Cancel</button>
</dialog>
<script>
"use strict";
// Starter console — adapt nouns, fields and endpoints to YOUR contract. No external assets; works from file://.
const CLIENTS={internal:{id:"INTERNAL-APP",key:"int-dev-key"},partner:{id:"PARTNER-AGENCY",key:"partner-dev-key"}};
const $=i=>document.getElementById(i); const out=$("out");
function H(extra){const c=CLIENTS[$("who").value];return Object.assign({"X-Client-Id":c.id,"X-Api-Key":c.key},extra||{});}
async function go(method,path,extra,body){const o={method,headers:H(extra)};if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
  try{const r=await fetch($("base").value.replace(/\/$/,"")+path,o);let j=null;try{j=await r.json()}catch(_){}
    return{s:r.status,j};}catch(e){return{s:0,j:{code:"NETWORK",detail:String(e),action:"Is the service running? Is dev CORS on?"}}}}
function card(cls,title,inner){out.insertAdjacentHTML("afterbegin",`<div class="card ${cls}"><h3>${title}</h3>${inner}</div>`);}
function kv(o,skip){return `<div class="kv">${Object.entries(o).filter(([k])=>!(skip||[]).includes(k)).map(([k,v])=>`<b>${k}</b><span>${typeof v==="object"?JSON.stringify(v):String(v)}</span>`).join("")}</div>`;}
function refusal(r,what){card("bad",`Refused — ${what}`,kv({code:r.j?.code??r.s,detail:r.j?.detail??"",action:r.j?.action??""})+`<p style="font-size:12.5px;color:var(--mut)">This refusal was logged. That is the point: least access, with a trail.</p>`);}
async function verify(){const id=$("rid").value.trim();const r=await go("GET",`/records/${id}/verify`);
  if(r.s===200)card(r.j.found!==false?"ok":"bad",`Verification — ${id}`,kv(r.j,["synthetic"]));else refusal(r,"verify");}
async function detail(){const id=$("rid").value.trim();let purpose="";
  if($("who").value==="internal"){purpose=prompt("Stated purpose for reading this record (goes in the access log):","Renewal case SBX-CASE-0012")||"";if(!purpose)return;}
  const r=await go("GET",`/records/${id}`,purpose?{"X-Purpose":purpose}:{});
  if(r.s===200)card("ok",`Full record — ${id}`,kv(r.j,["synthetic"]));else refusal(r,"full record");}
let pending=null;
async function fileReq(){const id=$("rid").value.trim();pending={path:"/requests",body:{recordId:id,requestType:"RENEWAL",remarks:"Filed from officer console"},ikey:"ui-"+Date.now()};
  $("csum").innerHTML=kv({record:id,request:"RENEWAL",by:CLIENTS[$("who").value].id});$("confirm").showModal();}
async function confirmYes(){$("confirm").close();const r=await go("POST",pending.path,{"Idempotency-Key":pending.ikey,"X-Human-Confirmed":"true"},pending.body);
  if(r.s<300)card("ok","Filed — receipt",kv(r.j,["synthetic"]));else refusal(r,"filing");}
async function log(){const id=$("rid").value.trim();const r=await go("GET",`/access-log?subject=${encodeURIComponent(id)}`,{"X-Purpose":"Reviewing access to this record"});
  const items=r.s===200?(Array.isArray(r.j)?r.j:(r.j.items||[])):null;
  if(!items){refusal(r,"access log");return;}
  const rows=items.slice(0,30).map(e=>`<tr><td>${e.ts??""}</td><td>${e.clientId??""}</td><td>${e.method??""} ${e.path??""}</td><td>${e.purpose??""}</td><td class="${e.status<400?"status-ok":"status-bad"}">${e.status??""}</td></tr>`).join("");
  card("ok",`Who accessed ${id} — and why`,`<table><tr><th>when</th><th>who</th><th>what</th><th>stated purpose</th><th>result</th></tr>${rows}</table>`);}
</script>
</body>
</html>
